<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brewcraft · Owner sign in</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171411;color:#f7efe4;font-family:Inter,system-ui,sans-serif;padding:20px}
.card{width:min(420px,100%);padding:36px;background:#24201c;border:1px solid #494036;border-radius:24px;box-shadow:0 24px 80px #0006}
.logo{font-size:32px}h1{margin:12px 0 5px;font-size:28px;letter-spacing:-1px}.muted{color:#b9aca0;margin:0 0 26px}label{display:block;font-size:13px;margin:16px 0 7px;color:#d9c9b8}input{width:100%;padding:13px 14px;border:1px solid #50463b;border-radius:11px;background:#171411;color:#fff;font-size:15px}button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:11px;background:#d6a56d;color:#21180f;font-weight:800;font-size:15px;cursor:pointer}.error{color:#ff9f8d;font-size:13px;margin-top:12px}.hint{margin-top:18px;font-size:12px;color:#9c8d7f;line-height:1.6}
</style></head><body><main class="card"><div class="logo">☕</div><h1>Welcome back.</h1><p class="muted">Sign in to your Brewcraft control room.</p>
<form method="post"><label for="username">Owner username</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Enter dashboard →</button>{% if error %}<div class="error">{{ error }}</div>{% endif %}</form>
<div class="hint">First run default: <b>owner</b> / <b>change-me-now</b>.<br>Change these credentials before using this app for real business.</div></main></body></html>
